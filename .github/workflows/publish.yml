# Publish a verified release to PyPI via Trusted Publishing (OIDC, no API token).
# The workflow builds nothing: it downloads the exact files attached to the tag's
# GitHub Release produced by release.yml / tests/release_check.py and verifies
# their SHA-256 against release.json before uploading.
name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.2.0"
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/acceptbox
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release artifacts and verify them against release.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9][a-zA-Z0-9.]*$ ]]; then
            echo "Invalid release tag: $TAG (expected v<version>, e.g. v0.2.0)" >&2
            exit 1
          fi
          version="${TAG#v}"
          wheel="acceptbox-$version-py3-none-any.whl"
          sdist="acceptbox-$version.tar.gz"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern "$wheel" \
            --pattern "$sdist" \
            --pattern release.json
          python3 - "$version" "$wheel" "$sdist" <<'PY'
          import hashlib, json, sys
          from pathlib import Path

          version, expected_wheel, expected_sdist = sys.argv[1], sys.argv[2], sys.argv[3]
          release = json.loads(Path("dist/release.json").read_text(encoding="utf-8"))
          assert release["result"] == "PASS", release["result"]
          assert release["version"] == version, (release["version"], version)
          expected_files = {"wheel": expected_wheel, "sdist": expected_sdist}
          for kind, expected_name in expected_files.items():
              assert release[kind]["file"] == expected_name, (release[kind]["file"], expected_name)
              path = Path("dist") / expected_name
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == release[kind]["sha256"], (path.name, digest)
              print(path.name, digest)
          PY
          rm dist/release.json

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
