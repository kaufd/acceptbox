[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "acceptbox"
version = "0.3.0"
description = "Independent bugfix acceptance gate for Git commit chains (base -> repro -> head)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []
keywords = ["testing", "acceptance", "git", "bugfix", "coding-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/kaufd/acceptbox"
Documentation = "https://github.com/kaufd/acceptbox/blob/main/docs/usage.md"
Source = "https://github.com/kaufd/acceptbox"
Issues = "https://github.com/kaufd/acceptbox/issues"

[project.scripts]
acceptbox = "acceptbox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/acceptbox"]

[tool.hatch.build.targets.sdist]
include = ["/src/acceptbox", "/actions", "/tests", "/README.md", "/README.ru.md", "/LICENSE", "/pyproject.toml"]
