name: AcceptBox setup
description: Installs AcceptBox (and optionally WitnessBox) from PyPI and verifies wheels and --installation against release.json

inputs:
  version:
    description: AcceptBox version in X.Y.Z format
    required: true
  witnessbox-version:
    description: Optional WitnessBox version in X.Y.Z format (for --mode witnessbox)
    required: false
    default: ""
  python-version:
    description: Python version to set up
    required: false
    default: "3.12"

outputs:
  installation:
    description: Path to the JSON printed by acceptbox --installation
    value: ${{ steps.install-acceptbox.outputs.installation }}

runs:
  using: composite
  steps:
    - name: Validate version inputs
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        WB_VERSION: ${{ inputs.witnessbox-version }}
      run: |
        set -euo pipefail
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "version: expected X.Y.Z, got '$VERSION'" >&2
          exit 2
        fi
        if [ -n "$WB_VERSION" ] && ! [[ "$WB_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "witnessbox-version: expected X.Y.Z, got '$WB_VERSION'" >&2
          exit 2
        fi

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    - name: Download AcceptBox release.json and wheel
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        dest="$RUNNER_TEMP/acceptbox-setup"
        rm -rf "$dest"
        mkdir -p "$dest"
        gh release download "v$VERSION" --repo kaufd/acceptbox \
          --pattern release.json --dir "$dest" --clobber
        python -I -m pip download --disable-pip-version-check \
          --no-deps --only-binary=:all: \
          --dest "$dest" "acceptbox==$VERSION"
        wheel=""
        for candidate in "$dest"/acceptbox-"$VERSION"-*.whl; do
          [ -e "$candidate" ] || continue
          if [ -n "$wheel" ]; then
            echo "wheel: expected one acceptbox-$VERSION-*.whl, found several" >&2
            exit 2
          fi
          wheel=$candidate
        done
        [ -n "$wheel" ] || { echo "wheel: acceptbox-$VERSION-*.whl not found" >&2; exit 2; }
        python -I "$GITHUB_ACTION_PATH/verify_release.py" wheel "$dest/release.json" "$wheel"
        echo "ACCEPTBOX_WHEEL=$wheel" >> "$GITHUB_ENV"

    - name: Install verified AcceptBox wheel and verify --installation
      id: install-acceptbox
      shell: bash
      run: |
        set -euo pipefail
        dest="$RUNNER_TEMP/acceptbox-setup"
        uv tool install --force "$ACCEPTBOX_WHEEL"
        tool_bin="$(uv tool dir --bin)"
        echo "$tool_bin" >> "$GITHUB_PATH"
        export PATH="$tool_bin:$PATH"
        acceptbox --version >/dev/null
        acceptbox --installation > "$dest/installation.json"
        python -I "$GITHUB_ACTION_PATH/verify_release.py" installation \
          "$dest/release.json" "$dest/installation.json"
        echo "installation=$dest/installation.json" >> "$GITHUB_OUTPUT"

    - name: Download, verify, and install optional WitnessBox wheel
      if: inputs.witnessbox-version != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        WB_VERSION: ${{ inputs.witnessbox-version }}
      run: |
        set -euo pipefail
        dest="$RUNNER_TEMP/witnessbox-setup"
        rm -rf "$dest"
        mkdir -p "$dest"
        gh release download "v$WB_VERSION" --repo kaufd/witnessbox \
          --pattern release.json --dir "$dest" --clobber
        python -I -m pip download --disable-pip-version-check \
          --no-deps --only-binary=:all: \
          --dest "$dest" "witnessbox==$WB_VERSION"
        wheel=""
        for candidate in "$dest"/witnessbox-"$WB_VERSION"-*.whl; do
          [ -e "$candidate" ] || continue
          if [ -n "$wheel" ]; then
            echo "wheel: expected one witnessbox-$WB_VERSION-*.whl, found several" >&2
            exit 2
          fi
          wheel=$candidate
        done
        [ -n "$wheel" ] || { echo "wheel: witnessbox-$WB_VERSION-*.whl not found" >&2; exit 2; }
        python -I "$GITHUB_ACTION_PATH/verify_release.py" wheel "$dest/release.json" "$wheel"
        uv tool install --force "$wheel"
        tool_bin="$(uv tool dir --bin)"
        echo "$tool_bin" >> "$GITHUB_PATH"
        export PATH="$tool_bin:$PATH"
        witnessbox --installation > "$dest/installation.json"
        python -I "$GITHUB_ACTION_PATH/verify_release.py" installation \
          "$dest/release.json" "$dest/installation.json"
