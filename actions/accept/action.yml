name: AcceptBox accept
description: Runs AcceptBox acceptance on a pull request (bugfix or refactor policy), uploads accept.json, posts PR verdict, and sets commit status

inputs:
  github-token:
    description: Token with contents:read, statuses:write, and pull-requests:write (if post-comment is true)
    required: false
    default: ${{ github.token }}
  policy:
    description: "Acceptance policy: auto, bugfix, or refactor"
    required: false
    default: auto
  mode:
    description: "Acceptance mode: auto, command, or witnessbox"
    required: false
    default: auto
  base-ref:
    description: Base branch ref checked via trusted origin
    required: false
    default: ${{ github.event.pull_request.base.ref }}
  base:
    description: Base commit SHA (defaults to PR base SHA)
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  head:
    description: Head commit SHA (defaults to PR head SHA)
    required: false
    default: ${{ github.event.pull_request.head.sha }}
  repro:
    description: Optional explicit repro commit SHA (bugfix policy only; auto-resolved if omitted)
    required: false
    default: ""
  repro-strategy:
    description: "How to resolve repro when omitted: first-commit or trailer-only"
    required: false
    default: first-commit
  inv:
    description: Optional comma-separated WitnessBox invariants
    required: false
    default: ""
  ebt-sha:
    description: Optional pinned EBT commit SHA (auto-pinned from trusted origin/<base-ref> if omitted in witnessbox mode)
    required: false
    default: ""
  approved-tree:
    description: Optional approved SHA-256 of ebt/ (must pair with ebt-sha)
    required: false
    default: ""
  repo:
    description: Path to checked-out repository
    required: false
    default: "."
  strict-refs:
    description: Fail-closed if trusted ref source degrades to local
    required: false
    default: "true"
  allow-forks:
    description: Allow running on PRs from forked repositories
    required: false
    default: "false"
  set-status:
    description: Publish GitHub commit status
    required: false
    default: "true"
  status-context:
    description: GitHub commit status context name
    required: false
    default: acceptbox/accept
  post-comment:
    description: Post/update a sticky PR comment with the verdict and log tail
    required: false
    default: "true"
  attest:
    description: Sign accept.json with actions/attest-build-provenance (requires id-token:write and attestations:write)
    required: false
    default: "false"

outputs:
  result:
    description: Final verdict (ACCEPTED, REJECTED, or ERROR)
    value: ${{ steps.finalize.outputs.result }}
  reason-code:
    description: Machine-readable reason_code (empty on ACCEPTED)
    value: ${{ steps.finalize.outputs.reason_code }}
  report-path:
    description: Path to accept.json
    value: ${{ runner.temp }}/acceptbox-out/accept.json

runs:
  using: composite
  steps:
    - name: Set pending commit status
      if: inputs.set-status == 'true' && inputs.head != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        HEAD_SHA: ${{ inputs.head }}
        STATUS_CONTEXT: ${{ inputs.status-context }}
        TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
          -f state=pending -f context="$STATUS_CONTEXT" \
          -f description="running AcceptBox acceptance" \
          -f target_url="$TARGET_URL" >/dev/null

    - name: Check fork policy and resolve PR parameters
      id: resolve
      shell: bash
      env:
        ALLOW_FORKS: ${{ inputs.allow-forks }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        BASE_REPO: ${{ github.repository }}
        PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels) }}
        PR_BODY: ${{ github.event.pull_request.body }}
        IN_REPO: ${{ inputs.repo }}
        IN_BASE: ${{ inputs.base }}
        IN_HEAD: ${{ inputs.head }}
        IN_BASE_REF: ${{ inputs.base-ref }}
        IN_POLICY: ${{ inputs.policy }}
        IN_MODE: ${{ inputs.mode }}
        IN_REPRO: ${{ inputs.repro }}
        IN_REPRO_STRATEGY: ${{ inputs.repro-strategy }}
        IN_INV: ${{ inputs.inv }}
        IN_EBT_SHA: ${{ inputs.ebt-sha }}
        IN_APPROVED_TREE: ${{ inputs.approved-tree }}
      run: |
        set -euo pipefail
        if [ "$ALLOW_FORKS" != "true" ] && [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "$BASE_REPO" ]; then
          echo "ACCEPTBOX_CI_ERROR=PR from fork ($HEAD_REPO) is not allowed" >> "$GITHUB_ENV"
          echo "PR from fork ($HEAD_REPO) is not allowed" >&2
          exit 2
        fi
        printf '%s' "$PR_BODY" > "$RUNNER_TEMP/acceptbox-pr-body.txt"
        set +e
        err=$(python3 -I "$GITHUB_ACTION_PATH/resolve_pr.py" \
          --repo "$IN_REPO" \
          --base "$IN_BASE" \
          --head "$IN_HEAD" \
          --base-ref "$IN_BASE_REF" \
          --policy "$IN_POLICY" \
          --mode "$IN_MODE" \
          --repro "$IN_REPRO" \
          --repro-strategy "$IN_REPRO_STRATEGY" \
          --inv "$IN_INV" \
          --ebt-sha "$IN_EBT_SHA" \
          --approved-tree "$IN_APPROVED_TREE" \
          --pr-labels-json "${PR_LABELS_JSON:-[]}" \
          --pr-body-file "$RUNNER_TEMP/acceptbox-pr-body.txt" \
          --output-json "$RUNNER_TEMP/acceptbox-plan.json" 2>&1)
        rc=$?
        set -e
        if [ "$rc" -ne 0 ]; then
          printf '%s\n' "$err" >&2
          one_line=$(printf '%s' "$err" | tr '\n' ' ')
          echo "ACCEPTBOX_CI_ERROR=$one_line" >> "$GITHUB_ENV"
          exit "$rc"
        fi
        cat "$RUNNER_TEMP/acceptbox-plan.json"

    - name: Run acceptbox accept
      id: accept
      shell: bash
      env:
        IN_REPO: ${{ inputs.repo }}
        STRICT_REFS: ${{ inputs.strict-refs }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/acceptbox-out"
        rm -rf "$out"
        set +e
        python3 -I - "$RUNNER_TEMP/acceptbox-plan.json" "$IN_REPO" "$out" "$STRICT_REFS" <<'PY'
        import json, subprocess, sys
        from pathlib import Path

        plan = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
        repo, out_dir, strict = sys.argv[2], sys.argv[3], sys.argv[4] == "true"

        argv = [
            "acceptbox", "accept",
            "--repo", repo,
            "--policy", plan["policy"],
            "--base", plan["base"],
            "--head", plan["head"],
            "--out", out_dir,
        ]
        if plan["mode"]:
            argv += ["--mode", plan["mode"]]
        if plan["repro"]:
            argv += ["--repro", plan["repro"]]
        if plan["base_ref"]:
            argv += ["--base-ref", plan["base_ref"]]
        if strict:
            argv.append("--strict-refs")
        if plan["inv"]:
            argv += ["--inv", plan["inv"]]
        if plan["ebt_sha"]:
            argv += ["--ebt-sha", plan["ebt_sha"]]
        if plan["approved_tree"]:
            argv += ["--approved-tree", plan["approved_tree"]]

        print("$", " ".join(argv), flush=True)
        proc = subprocess.run(argv)
        sys.exit(proc.returncode)
        PY
        rc=$?
        set -e
        echo "ACCEPTBOX_RAW_RC=$rc" >> "$GITHUB_ENV"
        if [ -f "$out/accept.json" ]; then
          echo "has_report=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_report=false" >> "$GITHUB_OUTPUT"
        fi
        exit 0

    - name: Sign accept.json with GitHub attestation
      id: attest
      if: inputs.attest == 'true' && steps.accept.outputs.has_report == 'true'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ${{ runner.temp }}/acceptbox-out/accept.json

    - name: Upload acceptbox-verdict artifact
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: acceptbox-verdict
        path: ${{ runner.temp }}/acceptbox-out
        if-no-files-found: warn

    - name: Evaluate report, publish summary, comment, and final status
      id: finalize
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        HEAD_SHA: ${{ inputs.head }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        STRICT_REFS: ${{ inputs.strict-refs }}
        SET_STATUS: ${{ inputs.set-status }}
        STATUS_CONTEXT: ${{ inputs.status-context }}
        POST_COMMENT: ${{ inputs.post-comment }}
        ATTEST: ${{ inputs.attest }}
        ATTEST_OUTCOME: ${{ steps.attest.outcome }}
        TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        raw_rc="${ACCEPTBOX_RAW_RC:-2}"
        fallback="${ACCEPTBOX_CI_ERROR:-acceptbox did not produce accept.json}"
        strict_flag=()
        if [ "$STRICT_REFS" = "true" ]; then
          strict_flag=(--strict-refs)
        fi
        python3 -I "$GITHUB_ACTION_PATH/format_report.py" \
          --report "$RUNNER_TEMP/acceptbox-out/accept.json" \
          --raw-exit-code "$raw_rc" \
          "${strict_flag[@]}" \
          --fallback-error "$fallback" \
          --summary-out "$RUNNER_TEMP/acceptbox-summary.md" \
          --meta-out "$RUNNER_TEMP/acceptbox-meta.json"

        cat "$RUNNER_TEMP/acceptbox-summary.md" >> "$GITHUB_STEP_SUMMARY"

        state=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["state"])' "$RUNNER_TEMP/acceptbox-meta.json")
        exit_code=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["exit_code"])' "$RUNNER_TEMP/acceptbox-meta.json")
        result=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["result"])' "$RUNNER_TEMP/acceptbox-meta.json")
        reason=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1])).get("reason_code") or "")' "$RUNNER_TEMP/acceptbox-meta.json")
        description=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["description"])' "$RUNNER_TEMP/acceptbox-meta.json")

        if [ "$ATTEST" = "true" ] && [ "$state" = "success" ] && [ "$ATTEST_OUTCOME" != "success" ]; then
          state="error"
          exit_code="2"
          result="ERROR"
          reason="attestation-failed"
          description="ERROR · attestation failed"
        fi

        echo "result=$result" >> "$GITHUB_OUTPUT"
        echo "reason_code=$reason" >> "$GITHUB_OUTPUT"

        if [ "$POST_COMMENT" = "true" ] && [ -n "$PR_NUMBER" ]; then
          existing_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- acceptbox-verdict -->")) | .id' | head -n1 || true)
          if [ -n "$existing_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing_id" \
              -F "body=@$RUNNER_TEMP/acceptbox-summary.md" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -F "body=@$RUNNER_TEMP/acceptbox-summary.md" >/dev/null
          fi
        fi

        if [ "$SET_STATUS" = "true" ] && [ -n "$HEAD_SHA" ]; then
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" -f context="$STATUS_CONTEXT" \
            -f description="$description" -f target_url="$TARGET_URL" >/dev/null
        fi

        exit "$exit_code"
